[core]
strict = false
auto_fix = false

[watch]
debounce_ms = 1000
ignore_patterns = ["dist/**", "coverage/**"]

[gemini]
# Prefer GEMINI_API_KEY in the environment or local .env.
# model = "gemini-3.1-pro" # optional override for every ask mode
fast_model = "gemini-3.1-flash-lite"
deep_model = "gemini-3.1-pro"
timeout_secs = 120
context_window = 128000

[temporal]
max_commits = 1000
max_files_per_commit = 50
coupling_threshold = 0.75
all_parents = false

[hotspots]
max_commits = 500
limit = 10
history_budget_secs = 45
# overall_budget_secs is the list/explain overall emit budget (0349); 0 disables.
# overall_budget_secs = 25
# budget_threshold = 0.5  # informational default when omitted; required for --fail

[local_model]
base_url = "http://localhost:8080" # Example for llama-server
chat_model = "llama-3"
embedding_model = "nomic-embed-text"
# Native nomic-embed-text width is 768. Omit this key to let probe/store resolve.
dimensions = 768
api_key = "optional"

[docs]
include = ["docs", "architecture"]
exclude = ["archive"]

[contracts]
spec_paths = ["openapi.yaml", "docs/swagger.json"]

[verify]
semantic_weight = 0.3
default_timeout_secs = 120

[coverage]
enabled = true

[coverage.traces]
enabled = true
config_patterns = ["**/otel*.yaml", "**/jaeger*.yaml", "**/datadog*.yaml"]
env_var_patterns = ["OTEL_*", "JAEGER_*", "DD_*", "OTLP_*"]

[coverage.sdk]
enabled = true
patterns = ["stripe", "auth0", "twilio", "aws-sdk"]

[coverage.services]
enabled = true

[coverage.data_flow]
enabled = true

[coverage.deploy]
enabled = true
patterns = ["**/Dockerfile*", "**/docker-compose*.yml", "**/*.tf", "**/k8s/**/*.yaml"]

[coverage.ci_self_awareness]
enabled = true

[coverage.adr_staleness]
enabled = true
threshold_days = 365

# Example only — this file is fully-enabled (0186-D). Product CoverageConfig
# defaults stay false. Copying this file to .ledgerful/config.toml can skip
# `config set coverage.enabled=true` / `coverage.services.enabled=true`.
# Do not treat coverage.deploy.enabled as an 0186 DoD.
# config set cannot write array-of-tables; hand-edit these rows.

# Optional review backends (0304). Omit the table for git+impact join only.
# expected_path_globs uses globset full-path match: * does not cross /.
# Nested sources need **/*.rs (*.rs matches only repo-root files).
# overall_budget_secs is the review overall emit budget (0348); 0 disables.
# [review]
# overall_budget_secs = 25
# requirements_files = []
# expected_path_globs = ["**/*.rs"]
#
# [review.github]
# enabled = false
# repo = ""
#
# [review.conductor]
# root = ""
#
# [review.ci]
# github_checks = false

# Overall unscoped audit emit budget (0350). Distinct from history_budget_secs.
# [audit]
# overall_budget_secs = 25

[[services.definitions]]
name = "ledgerful"
root = "src"
owners = ["engine"]
runtime_name = "ledgerful"

[[services.definitions]]
name = "ledgerful-mcp"
root = "mcp-server"
owners = ["engine"]
runtime_name = "ledgerful-mcp"
