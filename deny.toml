[advisories]
version = 2
yanked = "warn"
ignore = [
    # Cozo 0.7.6 transitively pins these Sled/graph dependencies and no
    # compatible safe upgrade exists without replacing Cozo storage.
    "RUSTSEC-2023-0089",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2025-0052",
    "RUSTSEC-2025-0141",
    # cozo 0.8.1 → smartstring 1.0.1 unmaintained (RUSTSEC-2026-0249). No safe
    # upgrade without replacing Cozo; tracked with dep hygiene 0169–0172.
    "RUSTSEC-2026-0249",
    # serde_yaml 0.9.34+deprecated → unsafe-libyaml 0.2.11 unmaintained
    # (RUSTSEC-2024-0449). No safe upgrade without replacing serde_yaml.
    "RUSTSEC-2024-0449",
    # RUSTSEC-2026-0381 stays an advisory-id ignore. Neither ignore list can
    # limit that id to one crate or version. ureq 2.12.1 depends on
    # webpki-roots 0.26.11, which depends on webpki-roots 1.0.10. 0.26.11
    # has no trust store of its own; it re-exports that 1.x parent. The
    # advisory marks =0.26.11 unaffected and >=1.0.10 patched. cargo-deny
    # check advisories reports this id advisory-not-detected on this
    # lockfile. The sentence is cargo-deny's report. The id still covers
    # every later webpki-roots version that matches.
    # Remove this id when ureq no longer depends on webpki-roots 0.26.x (the ureq 3 migration).
    "RUSTSEC-2026-0381",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "PolyForm-Noncommercial-1.0.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/Ryan-AI-Studios/cozo-redux",
]
