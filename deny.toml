[advisories]
version = 2
yanked = "warn"
ignore = [
    # Cozo 0.7.6 transitively pins these Sled/graph dependencies and no
    # compatible safe upgrade exists without replacing Cozo storage.
    "RUSTSEC-2023-0089",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2025-0052",
    "RUSTSEC-2025-0141",
    # cozo 0.8.1 → smartstring 1.0.1 unmaintained (RUSTSEC-2026-0249). No safe
    # upgrade without replacing Cozo; tracked with dep hygiene 0169–0172.
    "RUSTSEC-2026-0249",
    # serde_yaml 0.9.34+deprecated → unsafe-libyaml 0.2.11 unmaintained
    # (RUSTSEC-2024-0449). No safe upgrade without replacing serde_yaml.
    "RUSTSEC-2024-0449",
    # webpki-roots 0.26.11 (RUSTSEC-2026-0381) is pinned by ureq 2.12.1; the
    # fix requires >=1.0.10 and no 0.26.x patch exists. ureq 3.x migration is a
    # separate dependency-hygiene task; risk accepted temporarily. The direct
    # rustls-webpki, webpki-root-certs, and webpki-roots 1.x paths are patched.
    "RUSTSEC-2026-0381",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "PolyForm-Noncommercial-1.0.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/Ryan-AI-Studios/cozo-redux",
]
