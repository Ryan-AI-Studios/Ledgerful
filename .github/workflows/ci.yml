name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - name: Classify rust vs docs-only
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed: rust=true unless every changed file is cheap and off both lists.
          # 0573-compile-exceptions-begin
          # README.md
          # SECURITY.md
          # docs/Call-Resolution.md
          # docs/Ledgerful/skill.md
          # docs/agent-output-contract.md
          # docs/golden-path.md
          # docs/installation.md
          # docs/package-distribution.md
          # docs/verify-performance.md
          # 0573-compile-exceptions-end
          # 0573-runtime-exceptions-begin
          # README.md
          # docs/examples/config.toml
          # 0573-runtime-exceptions-end
          echo "rust=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            exit 0
          fi
          set +e
          body=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" 2>gh-api.err)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            exit 0
          fi
          files=$(printf '%s\n' "$body" | jq -s -e '
            if length == 0 then error("empty")
            elif (length == 1) and (.[0] | type) == "array" then .[0]
            elif all(type == "array") then add
            else error("not-arrays") end
            | if all(type == "object" and has("filename")) then .
              else error("not-entries") end
          ') || exit 0
          count=$(printf '%s\n' "$files" | jq 'length')
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ]; then
            exit 0
          fi
          is_cheap() {
            case "$1" in
              docs/api/openapi.json) return 1 ;;
              CHANGELOG.md|README.md|LICENSE|SECURITY.md|AGENTS.md|Agents.md|Claude.md|scripts/bump-manifests.ps1|scripts/bump-manifests.sh) return 0 ;;
              docs/*|packaging/*) return 0 ;;
              *) return 1 ;;
            esac
          }
          is_exception() {
            case "$1" in
              README.md|SECURITY.md|docs/Call-Resolution.md|docs/Ledgerful/skill.md|docs/agent-output-contract.md|docs/golden-path.md|docs/installation.md|docs/package-distribution.md|docs/verify-performance.md|docs/examples/config.toml) return 0 ;;
              *) return 1 ;;
            esac
          }
          # 0576: a renamed entry whose previous_filename is missing, null, empty,
          # or not a string never reaches the cheap check or the rust=false write.
          if printf '%s\n' "$files" | jq -e 'any(.[]; .status == "renamed" and ((.previous_filename | type) != "string" or .previous_filename == ""))' >/dev/null; then
            :
          else
            docs_only=1
            while IFS= read -r path; do
              if ! is_cheap "$path" || is_exception "$path"; then
                docs_only=0
                break
              fi
            done < <(printf '%s\n' "$files" | jq -r '.[] | .filename, (.previous_filename // empty)')
            if [ "$docs_only" -eq 1 ]; then
              echo "rust=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Public frontend repo — no PAT. Dependabot PR workflows cannot read
      # repository secrets (only Dependabot secrets), so a required token
      # fails as empty ("Input required and not supplied: token").
      # 0573: clippy, test, test-slow, and search-perf no longer need this job.
      # 0241 shipped-vs-tested: required ubuntu web-build still pins 4a1df7e2 / Node 22.
      # Tried frontend main 71d2d2db + Node 24: npm ci passed (not EBADENGINE); npm run
      # build failed in ~36s (not timeout) — Linux CSP/build class. release.yml still
      # embeds frontend main dynamically on windows-latest. Frontend gating `build` is
      # Windows-only (0087). smoke.yml does not build this frontend (0492); this pin stays on ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ryan-AI-Studios/ledgerful-frontend
          ref: 4a1df7e2be68bb1136a18c52f1ba420801858c89
          path: ledgerful-frontend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: ledgerful-frontend
      - run: npm run build
        working-directory: ledgerful-frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ledgerful-web-spa
          path: ledgerful-frontend/out

  fmt:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          # Pin exact 1.98.1 (not floating `stable`). Bump = manual PR when we
          # want a new compiler; not Dependabot (it bumps action SHAs, not rustc).
          # dtolnay uses rustup --profile minimal; fmt/clippy must request components.
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # GitHub rejects `matrix` in a job-level `if` ("Unrecognized named-value: matrix"),
      # so Windows clippy is the separate job below. fail-fast stays false.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Docs-only suite skip
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: echo "Suite skipped as docs-only; this required check succeeded without compiling." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust == 'true'
      - name: cargo clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  clippy-windows:
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Docs-only suite skip
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: echo "Suite skipped as docs-only; this required check succeeded without compiling." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust == 'true'
      - name: cargo clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Docs-only suite skip
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: echo "Suite skipped as docs-only; this required check succeeded without compiling." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust == 'true'
        with:
          shared-key: nextest-${{ runner.os }}
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Install cargo-nextest
        if: needs.changes.outputs.rust == 'true'
        # Pin mainline v2 release SHA (not per-tool tags). Dependabot shallow-
        # clones cannot resolve diverged nextest/cargo-llvm-cov/cargo-mutants
        # convenience commits (error: no such commit).
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest

      - name: Run fast tier (default + integration)
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        # Uses `.config/nextest.toml` profile `ci` (excludes `__slow` tests).
        # `-j 4` on Windows: bounded parallelism (4 vCPU / 16 GB runner).
        # Phase-0 of track 0062 found the old `-j 1` was guarding test-runtime
        # OOM, not compile (no build-jobs cap exists). Full-parallel local run:
        # 2134 passed, 0 flakes. `#[serial(cwd/env)]` are no-ops under
        # nextest's process-per-test model (serial_test 3.5.0, no file_locks).
        # If CI OOMs at -j 4, drop to -j 2.
        # See `.config/nextest.toml` [test-groups.serial] for confirmed contenders.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo nextest run -j 4 --workspace --all-features --profile ci
          else
            cargo nextest run --workspace --all-features --profile ci
          fi

      - name: Run doctests
        if: needs.changes.outputs.rust == 'true' && runner.os != 'Windows'
        shell: bash
        run: cargo test --workspace --all-features --doc

  test-slow:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Docs-only suite skip
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: echo "Suite skipped as docs-only; this required check succeeded without compiling." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust == 'true'
        with:
          shared-key: nextest-${{ runner.os }}
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Install cargo-nextest
        if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest

      - name: Run slow tier
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        # `-j 4` on Windows: bounded parallelism for the 4 vCPU / 16 GB runner.
        # See the `test` job and `.config/nextest.toml` [test-groups.serial].
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo nextest run -j 4 --workspace --all-features --profile slow
          else
            cargo nextest run --workspace --all-features --profile slow
          fi

  search-perf:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        timeout-minutes: 15
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 15
        with:
          # Save dependency artifacts even when the build fails or times out.
          # A pull_request cache is scoped to that PR's ref, so it warms re-runs of
          # the same PR only; other PRs restore main's push/schedule cache. rust-cache
          # prunes workspace crates, so what a failed build saves is dependencies.
          cache-on-failure: true
      - name: Build release search perf test binaries
        id: build
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          mkdir -p search-perf-out
          cargo test --release --no-run --lib --test integration 2>&1 | tee search-perf-out/build.txt
      - name: Release search perf gate
        id: gate
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --lib search::perf_gate::search_perf_warm_query_budget -- --ignored --exact --nocapture | tee search-perf-out/lib.txt
          grep -q "search_perf_warm_query_budget ... ok" search-perf-out/lib.txt
          cargo test --release --test integration search_correctness::search_perf_cli_cold_sample -- --ignored --exact --nocapture | tee search-perf-out/cli.txt
          grep -q "search_perf_cli_cold_sample ... ok" search-perf-out/cli.txt
      - name: Warn if search-perf setup failed
        if: failure() && steps.build.outcome == 'skipped' && steps.gate.outcome == 'skipped'
        timeout-minutes: 15
        shell: bash
        run: |
          echo "::warning::search-perf setup failed before the build or gate ran (checkout, artifact download, toolchain or cache restore; non-blocking). No perf result is claimed."
          echo "search-perf setup failed before the build or gate ran (checkout, artifact download, toolchain or cache restore; non-blocking). No perf result is claimed." >> "$GITHUB_STEP_SUMMARY"
      - name: Warn if search-perf build failed or timed out
        if: failure() && steps.build.outcome == 'failure'
        timeout-minutes: 15
        shell: bash
        run: |
          echo "::warning::search-perf build failed or timed out (45-minute step budget; non-blocking). If this step ran its full budget it is infrastructure, not a perf regression; otherwise read the step log."
          echo "search-perf build failed or timed out (45-minute step budget; non-blocking). If this step ran its full budget it is infrastructure, not a perf regression; otherwise read the step log." >> "$GITHUB_STEP_SUMMARY"
      - name: Warn if search-perf gate failed or timed out
        if: failure() && steps.gate.outcome == 'failure'
        timeout-minutes: 15
        shell: bash
        run: |
          echo "::warning::search-perf gate failed or timed out (10-minute step budget; non-blocking). A gate that completed inside its budget is a perf or correctness result, see the search-perf-samples artifact. A gate that ran its full budget is infrastructure."
          echo "search-perf gate failed or timed out (10-minute step budget; non-blocking). A gate that completed inside its budget is a perf or correctness result, see the search-perf-samples artifact. A gate that ran its full budget is infrastructure." >> "$GITHUB_STEP_SUMMARY"
      - name: Warn if search-perf was cancelled
        if: cancelled() && !failure()
        timeout-minutes: 5
        shell: bash
        run: |
          echo "::warning::search-perf was cancelled before it finished (non-blocking). A cancelled run produces no perf result, so no regression is claimed."
          echo "search-perf was cancelled before it finished (non-blocking). A cancelled run produces no perf result, so no regression is claimed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: search-perf-samples
          path: search-perf-out/

  deny:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docs-only suite skip
        if: needs.changes.outputs.rust != 'true'
        shell: bash
        run: echo "Suite skipped as docs-only; this required check succeeded without compiling." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.rust == 'true'
      - name: Install cargo-deny and cargo-audit
        if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny check
        if: needs.changes.outputs.rust == 'true'
        run: cargo deny check
      - name: cargo audit
        if: needs.changes.outputs.rust == 'true'
        run: cargo audit

  no-network-public-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No-network grep (public export)
        shell: bash
        run: |
          result=$(grep -RE "ureq|reqwest|tokio_tungstenite" src/ledger/public_export.rs || true)
          if [ -n "$result" ]; then
            echo "FAIL: network dependencies found in public export module"
            echo "$result"
            exit 1
          fi
          echo "PASS: no network dependencies in public export module" > no-network-result.txt
      - name: No-network grep (self-timing)
        shell: bash
        run: |
          result=$(grep -RE "ureq|reqwest|tokio_tungstenite" \
            src/commands/timings.rs \
            src/state/storage/timings.rs \
            src/observability/self_timing.rs || true)
          if [ -n "$result" ]; then
            echo "FAIL: network dependencies found in self-timing path (0043)"
            echo "$result"
            exit 1
          fi
          echo "PASS: no network dependencies in self-timing modules" >> no-network-result.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: no-network-grep
          path: no-network-result.txt
          retention-days: 90

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov,nextest
      - run: cargo llvm-cov nextest --workspace --all-features --html --output-dir coverage/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/

  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        timeout-minutes: 15
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        timeout-minutes: 15
        with:
          tool: cargo-mutants,nextest
      - name: cargo mutants
        id: mutants
        timeout-minutes: 120
        run: cargo mutants --workspace --in-place --file 'src/ledger/**' --file 'crates/ledgerful-ledger/**' --file 'src/impact/**' --file 'src/verify/**'
      - name: Warn if mutation setup failed
        if: failure() && steps.mutants.outcome == 'skipped'
        timeout-minutes: 15
        shell: bash
        run: |
          echo "::warning::mutation setup failed before cargo mutants ran (checkout, toolchain or tool install; non-blocking). No mutation result is claimed."
          echo "mutation setup failed before cargo mutants ran (checkout, toolchain or tool install; non-blocking). No mutation result is claimed." >> "$GITHUB_STEP_SUMMARY"
      - name: Warn if mutation run failed or timed out
        if: failure() && steps.mutants.outcome == 'failure'
        timeout-minutes: 15
        shell: bash
        run: |
          echo "::warning::mutation run failed or timed out (120-minute step budget; non-blocking). A run that used its full budget is infrastructure; otherwise the mutants-report artifact records the outcome (surviving mutants, test timeouts, a failing baseline or an error)."
          echo "mutation run failed or timed out (120-minute step budget; non-blocking). A run that used its full budget is infrastructure; otherwise the mutants-report artifact records the outcome (surviving mutants, test timeouts, a failing baseline or an error)." >> "$GITHUB_STEP_SUMMARY"
      - name: Warn if mutation was cancelled
        if: cancelled() && !failure()
        timeout-minutes: 5
        shell: bash
        run: |
          echo "::warning::mutation was cancelled before it finished (non-blocking). A cancelled run produces no mutation result."
          echo "mutation was cancelled before it finished (non-blocking). A cancelled run produces no mutation result." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: mutants-report
          path: mutants.out/
