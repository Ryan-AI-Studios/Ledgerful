name: Windows path tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-path-tests.yml
      - src/cli/dispatch/**
      - src/commands/architecture/**
      - src/util/path.rs
      - tests/fixtures/architecture-proposal/**
      - tests/integration/cli_architecture_proposal.rs
      - tests/integration/path_security.rs

permissions:
  contents: read

jobs:
  path-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-nextest
        # Pin mainline v2 release SHA (not per-tool tags). Dependabot cannot
        # resolve diverged convenience commits (error: no such commit).
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - name: Run path regression tests
        run: >-
          cargo nextest run -j 1 --workspace --all-features --profile ci
          validate_export_path_accepts_valid_relative_file
          validate_export_path_refuses_absolute_path_in_src
          normalize_relative_path__dotdot_sequences__never_escapes_root
      - name: Witness proposal on a native 8.3 folder
        env:
          LEDGERFUL_TEST_REQUIRE_WINDOWS_SHORT_ALIAS: '1'
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'The 8.3 proposal witness requires a GitHub-hosted runner.'
          }
          $head = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) {
            throw "Checkout does not match the workflow SHA $env:GITHUB_SHA"
          }
          $tree = git rev-parse --verify 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the checked out tree.' }
          Write-Output "Windows proposal 8.3 candidate head=$head tree=$tree runner=$env:RUNNER_ENVIRONMENT os=$env:RUNNER_OS"
          $fixtureTemp = Join-Path $env:TEMP "Ledgerful proposal $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $fixtureTemp -ErrorAction Stop | Out-Null
          $parent = Get-Item -LiteralPath $fixtureTemp
          while ($null -ne $parent) {
            foreach ($marker in @('.git', '.jj', '.gitignore', '.ignore')) {
              if (Test-Path -LiteralPath (Join-Path $parent.FullName $marker)) {
                throw "8.3 fixture inherits $marker under $($parent.FullName)"
              }
            }
            $parent = $parent.Parent
          }
          $env:TEMP = $fixtureTemp
          $env:TMP = $fixtureTemp
          function Confirm-WitnessCheckout([string]$phase) {
            $changes = @(git status --porcelain=v1 --untracked-files=normal)
            if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 0) {
              throw "8.3 witness checkout is dirty or unreadable $phase the test."
            }
            Write-Output "Windows proposal 8.3 checkout clean $phase candidate=$head tree=$tree"
          }
          Confirm-WitnessCheckout 'before'
          cargo nextest run --locked --all-features -j 1 --test integration --profile slow --retries 0 --no-tests fail --success-output immediate-final -E 'test(=cli_architecture_proposal::architecture_proposal_native_windows_short_alias__slow)'
          $result = $LASTEXITCODE
          Write-Output "Windows proposal 8.3 nextest exit=$result candidate=$head tree=$tree"
          Confirm-WitnessCheckout 'after'
          exit $result
