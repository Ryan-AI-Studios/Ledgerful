# Workflow A — Ledgerful PR Scan (engine dogfood)
# Track 0068 / 0047 / 0086: two-workflow fork-PR pattern. This workflow is read-only.
# Untrusted PR code only runs here (scan). Workflow B posts the comment/check-run
# and never checks out or executes PR code.
#
# Pin: Ryan-AI-Studios/ledgerful-action@76e3ee8 (0086 Action PR #7 — null-tolerant
# validator, size guards, schema v1|v2). Engine binary: v0.2.1 + published Linux
# archive checksum (schema v2 emission). Never reintroduce inline `./action`.

name: Ledgerful PR Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR (full history required for diff)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run Ledgerful PR risk scan
        id: ledgerful-scan
        # Pin ledgerful-action to a full commit SHA (no mutable tag yet).
        uses: Ryan-AI-Studios/ledgerful-action@76e3ee8ffaa7f52c5c7bfa23d415f3a97bd8ec8f
        with:
          ledgerful-version: v0.2.1
          # ledgerful-x86_64-unknown-linux-gnu.tar.gz from v0.2.1 published .sha256 sidecar
          ledgerful-checksum: db8a26f4ffa44e46dd1094b8c028caf0966782c43c7d1e504acb55ca5238deda
        env:
          LEDGERFUL_NO_NETWORK: "1"

      - name: Upload JSON report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledgerful-pr-report
          path: ledgerful-pr-report.json
