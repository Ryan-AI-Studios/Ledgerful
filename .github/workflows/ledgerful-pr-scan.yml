# Workflow A — Ledgerful PR Scan (engine dogfood)
# Track 0068 / 0047 / 0086: two-workflow fork-PR pattern. This workflow is read-only.
# Untrusted PR code only runs here (scan). Workflow B posts the comment/check-run
# and never checks out or executes PR code.
#
# Pin: Ryan-AI-Studios/ledgerful-action@bacf400797142884c46e97c6ce755b7ef7433a53
# (0198 / 0086 consumer pin after Action PR #11 merge SHA; SHA bump follows
# Action v0.2.11 version PR merge). Engine binary: v0.2.11 + published Linux
# gnu sidecar. Never reintroduce inline `./action`.

name: Ledgerful PR Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR (full history required for diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Ledgerful PR risk scan
        id: ledgerful-scan
        # Pin ledgerful-action to a full commit SHA (no mutable tag yet).
        uses: Ryan-AI-Studios/ledgerful-action@bacf400797142884c46e97c6ce755b7ef7433a53
        with:
          ledgerful-version: v0.2.11
          # ledgerful-x86_64-unknown-linux-gnu.tar.gz from v0.2.11 published .sha256 sidecar
          ledgerful-checksum: 5c26c34db4cc50f51a6ff0cf129ad5c175c35716941f7c6354b47f3d7aa12e1a
        env:
          LEDGERFUL_NO_NETWORK: "1"

      - name: Upload JSON report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledgerful-pr-report
          path: ledgerful-pr-report.json
