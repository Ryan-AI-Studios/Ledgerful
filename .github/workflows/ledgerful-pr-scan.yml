# Workflow A — Ledgerful PR Scan (engine dogfood)
# Track 0068 / 0047 / 0086: two-workflow fork-PR pattern. This workflow is read-only.
# Untrusted PR code only runs here (scan). Workflow B posts the comment/check-run
# and never checks out or executes PR code.
#
# Pin: Ryan-AI-Studios/ledgerful-action@a867acedfb80798c4d96bea9f68020b2f899b3bd
# (Action PR #18 squash-merge SHA).
# Engine binary: v0.2.14 + published Linux gnu sidecar.
# Never reintroduce inline `./action`.

name: Ledgerful PR Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR (full history required for diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Ledgerful PR risk scan
        id: ledgerful-scan
        # Pin ledgerful-action to a full commit SHA (no mutable tag yet).
        uses: Ryan-AI-Studios/ledgerful-action@a867acedfb80798c4d96bea9f68020b2f899b3bd
        with:
          ledgerful-version: v0.2.14
          # ledgerful-x86_64-unknown-linux-gnu.tar.gz from v0.2.14 published .sha256 sidecar
          ledgerful-checksum: 2b1ac064a2db39b17c0dda4a88505930f91a8ab69af00cd8c42225c1bda8f9f1
        env:
          LEDGERFUL_NO_NETWORK: "1"

      - name: Upload JSON report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledgerful-pr-report
          path: ledgerful-pr-report.json
