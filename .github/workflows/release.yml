name: Release

on:
  push:
    tags:
      - "v*"
  # Allow re-running a release for an existing tag without retagging (ops recovery).
  # Recover with: gh workflow run release.yml --ref vX.Y.Z
  # (GITHUB_REF_NAME becomes the tag; do not reintroduce a separate version input.)
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "Optional ledgerful-frontend git ref/SHA to embed (empty = resolve main at run time)"
        required: false
        type: string
        default: ""

# Do not cancel an in-flight real release mid-publish (queued duplicate is preferable).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Gate A — fail before any build when tag disagrees with tree (0098).
  # workflow_dispatch --ref vX.Y.Z sets GITHUB_REF_NAME to the tag, so recovery
  # cannot skip preflight.
  preflight:
    name: Release preflight (Gate A)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check-release-tag
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/check-release-tag.sh
          scripts/check-release-tag.sh "${GITHUB_REF_NAME}"
      # Cheap MCP pin/wiring tests before multi-OS builds (v0.2.4 regression:
      # pack job failed after ~30m on a stale third pin in platform.test.js).
      # platform.test.js only — no Rust binary (smoke.test.js stays on mcp-package).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: MCP engine-tag pin unit tests
        working-directory: mcp-server
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test test/platform.test.js

  web-build:
    # windows-latest, not ubuntu-latest: ledgerful-frontend's gating ci.yml only ever runs `npm run
    # build` (the CSP script-hash-manifest generation/check) on windows-latest. A separate, non-gating
    # bundle-scan.yml also runs `npm run build` on ubuntu-latest (weekly cron + manual dispatch only)
    # — but its last recorded run (2026-07-20) predates 0081's CSP-hash mechanism (landed 2026-07-24),
    # so there is zero empirical evidence this manifest has ever built cleanly on Linux under the
    # current code, despite build-with-csp.mjs / linux-csp-refresh.sh's own comments claiming "Linux
    # CI parity" as the target (confirmed via `gh run list --repo ledgerful-frontend
    # --workflow=bundle-scan.yml` — 2026-07-25). Discovered here (0087): after fixing the stale
    # frontend ref pin and then the Node 22->24 mismatch, this job *still* failed on ubuntu-latest with
    # the same CSP-drift error — verified via `gh run list` that frontend CI's windows-latest `build`
    # job passed clean on this exact commit, and reproduced a clean match locally on Windows/Node 24.
    # Switching this job to windows-latest matches the only environment this manifest has ever
    # actually been proven against. The frontend-side "Linux parity" claim vs. no gating Linux
    # enforcement is a real cross-repo gap, logged to deferred.md — not fixed here.
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      frontend_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Public frontend repo — no PAT required. SHA is resolved at run time (0098 / spec §2.3 P3):
      # use workflow_dispatch frontend_ref when set, else ledgerful-frontend main via git ls-remote.
      # Resolve-and-record (job output + release body + step summary) buys post-hoc reproducibility.
      - name: Resolve frontend SHA
        id: resolve
        shell: bash
        env:
          INPUT_FRONTEND_REF: ${{ inputs.frontend_ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_FRONTEND_REF:-}" ]; then
            sha="${INPUT_FRONTEND_REF}"
            echo "Using workflow_dispatch frontend_ref=${sha}"
          else
            sha="$(git ls-remote https://github.com/Ryan-AI-Studios/ledgerful-frontend.git refs/heads/main | awk '{print $1; exit}')"
            if [ -z "$sha" ]; then
              echo "error: could not resolve ledgerful-frontend main via git ls-remote" >&2
              exit 1
            fi
            echo "Resolved ledgerful-frontend main=${sha}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "### Embedded SPA"
            echo ""
            echo "frontend_sha: \`${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ryan-AI-Studios/ledgerful-frontend
          ref: ${{ steps.resolve.outputs.sha }}
          path: ledgerful-frontend
      # Node 24 is explicit and deterministic (0087). Do NOT switch to
      # node-version-file: package.json — resolving engines ranges can float the
      # build Node version (the failure class 0087 spent three tag attempts on).
      # The engines guard below is forward defence only: with the SPA SHA floating
      # to frontend main, the frontend can raise its Node floor with no edit here.
      # It is NOT fixing a current mismatch (this job is already Node 24).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Node engines guard (frontend package.json)
        shell: bash
        run: |
          set -euo pipefail
          engines="$(node -p "require('./ledgerful-frontend/package.json').engines.node")"
          node_v="$(node -v)"
          echo "engines.node=${engines} node -v=${node_v}"
          if ! npx --yes semver -r "${engines}" "${node_v}"; then
            echo "error: Node ${node_v} does not satisfy ledgerful-frontend engines.node '${engines}'" >&2
            echo "error: raise release.yml node-version (keep it explicit; do not float via node-version-file)" >&2
            exit 1
          fi
      - run: npm ci
        working-directory: ledgerful-frontend
      - run: npm run build
        working-directory: ledgerful-frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledgerful-web-spa
          path: ledgerful-frontend/out

  build:
    name: Build ${{ matrix.asset }}
    needs: web-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ledgerful-x86_64-unknown-linux-gnu
            archive: tar
            binary: ledgerful
            target: ""
          - os: windows-latest
            asset: ledgerful-x86_64-pc-windows-msvc
            archive: zip
            binary: ledgerful.exe
            target: ""
          - os: macos-15
            asset: ledgerful-x86_64-apple-darwin
            archive: tar
            binary: ledgerful
            target: x86_64-apple-darwin
          - os: macos-14
            asset: ledgerful-aarch64-apple-darwin
            archive: tar
            binary: ledgerful
            target: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ledgerful-web-spa
          path: ../ledgerful-frontend/out
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Install cargo-auditable + cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-auditable --locked
          cargo install cargo-audit --locked
      - shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo auditable build --release --locked --all-features --target ${{ matrix.target }}
          else
            cargo auditable build --release --locked --all-features
          fi
      - name: Verify embedded dependency list
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            bin="target/release/${{ matrix.binary }}"
          fi
          cargo audit bin "$bin"
      - name: Package Unix
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.asset }}
          if [ -n "${{ matrix.target }}" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.asset }}/
          else
            cp target/release/${{ matrix.binary }} dist/${{ matrix.asset }}/
          fi
          cp -r ../ledgerful-frontend/out dist/${{ matrix.asset }}/web
          cp README.md LICENSE dist/${{ matrix.asset }}/
          tar -czf dist/${{ matrix.asset }}.tar.gz -C dist ${{ matrix.asset }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/${{ matrix.asset }}.tar.gz > dist/${{ matrix.asset }}.tar.gz.sha256
          else
            shasum -a 256 dist/${{ matrix.asset }}.tar.gz > dist/${{ matrix.asset }}.tar.gz.sha256
          fi
      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.asset }}" | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}/"
          Copy-Item "../ledgerful-frontend/out" "dist/${{ matrix.asset }}/web" -Recurse -Force
          Copy-Item README.md,LICENSE "dist/${{ matrix.asset }}/"
          Compress-Archive -Path "dist/${{ matrix.asset }}/*" -DestinationPath "dist/${{ matrix.asset }}.zip" -Force
          $archiveName = "${{ matrix.asset }}.zip"
          $archivePath = "dist/$archiveName"
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -Path "$archivePath.sha256" -Encoding ascii
      - name: Attest build provenance
        # actions/attest requires a public repo or GitHub Enterprise Cloud.
        # Repo is public; keep the private-repo fallback below in case visibility changes.
        # Uses actions/attest in default SLSA build-provenance mode (no custom predicate-type/predicate needed).
        if: github.event.repository.visibility == 'public' || github.event.repository.visibility == 'internal'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ matrix.asset }}.${{ matrix.archive == 'tar' && 'tar.gz' || 'zip' }}
      - name: Attest build provenance (private repo fallback)
        if: github.event.repository.visibility != 'public' && github.event.repository.visibility != 'internal'
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping GitHub artifact attestation: repository is not public and this is not GitHub Enterprise Cloud."
          echo "Attestation will be enabled automatically once the repo is public (when the repository becomes public)."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  mcp-package:
    name: Pack MCP npm package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo build --bin ledgerful --locked --no-default-features --features mcp,export
      - run: npm ci
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server
        env:
          LEDGERFUL_MCP_BIN_OVERRIDE: ${{ github.workspace }}/target/debug/ledgerful
      - run: mkdir -p dist
        working-directory: mcp-server
      - run: npm pack --pack-destination dist
        working-directory: mcp-server
        env:
          LEDGERFUL_MCP_SKIP_DOWNLOAD: "1"
      - name: Smoke packed MCP package
        working-directory: mcp-server
        shell: bash
        env:
          LEDGERFUL_MCP_BIN_OVERRIDE: ${{ github.workspace }}/target/debug/ledgerful
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          package="$(find "$PWD/dist" -name '*.tgz' -print -quit)"
          pushd "$scratch"
          npm init -y
          npm install "$package"
          popd
          LEDGERFUL_MCP_COMMAND="$scratch/node_modules/.bin/ledgerful-mcp" node test/smoke-local.js
      - name: Attest MCP package provenance
        # actions/attest requires a public repo or GitHub Enterprise Cloud.
        # Repo is public; keep the private-repo fallback below in case visibility changes.
        if: github.event.repository.visibility == 'public' || github.event.repository.visibility == 'internal'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: mcp-server/dist/*.tgz
      - name: Attest MCP package provenance (private repo fallback)
        if: github.event.repository.visibility != 'public' && github.event.repository.visibility != 'internal'
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping GitHub artifact attestation: repository is not public and this is not GitHub Enterprise Cloud."
          echo "Attestation will be enabled automatically once the repo is public (when the repository becomes public)."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledgerful-mcp-server-npm
          path: mcp-server/dist/*.tgz

  # 0053-SupplyChainAttestation Phase 1: per-release CycloneDX SBOM for the engine
  # (all features) + the MCP npm package. Lockfile-derived and target-independent,
  # so generated once here rather than per build-matrix entry.
  sbom:
    name: Generate SBOM (CycloneDX)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Install jsonschema (for SBOM validation)
        run: pip install jsonschema
      - name: Engine SBOM (all features — must match the --all-features release build)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cargo cyclonedx --all-features --format json
          # cargo-cyclonedx writes <package>.cdx.json next to Cargo.toml; capture it
          # by glob so we don't depend on the exact base-name across tool versions.
          sbom_file="$(find . -maxdepth 2 -name '*.cdx.json' -not -path './dist/*' -print -quit)"
          cp "$sbom_file" "dist/ledgerful-${version}.cdx.json"
      - name: MCP package SBOM
        working-directory: mcp-server
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm ci
          npm sbom --sbom-format cyclonedx > "../dist/ledgerful-mcp-server-${version}.cdx.json"
      - name: Validate SBOM (CycloneDX schema)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Download the CycloneDX JSON schema and validate both SBOMs against it.
          schema_url="https://raw.githubusercontent.com/CycloneDX/specification/refs/tags/1.5/schema/bom-1.5.schema.json"
          curl -fsSL "$schema_url" -o /tmp/cdx-schema.json
          for f in "dist/ledgerful-${version}.cdx.json" "dist/ledgerful-mcp-server-${version}.cdx.json"; do
            echo "Validating $f against CycloneDX 1.5 schema"
            python3 -c "
          import json, sys, jsonschema
          with open('/tmp/cdx-schema.json') as fh:
              schema = json.load(fh)
          with open(sys.argv[1]) as fh:
              doc = json.load(fh)
          jsonschema.validate(doc, schema)
          print(f'{sys.argv[1]}: valid CycloneDX 1.5')
          " "$f"
          done
      - name: Compute version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Attest SBOM (private repo fallback)
        if: github.event.repository.visibility != 'public' && github.event.repository.visibility != 'internal'
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping GitHub SBOM attestation: repository is not public and this is not GitHub Enterprise Cloud."
          echo "Attestation will be enabled automatically once the repo is public (when the repository becomes public)."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/*.cdx.json

  sign:
    name: Sign release artifacts (cosign keyless)
    needs:
      - build
      - mcp-package
      - sbom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Compute version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Attest engine SBOM
        # actions/attest-sbom requires a public repo or GitHub Enterprise Cloud.
        # Repo is public; keep the private-repo fallback below in case visibility changes.
        # The SBOM is lockfile-derived and target-independent, so it is bound to all release archives.
        # Note: GitHub Actions context does not expose enterprise status; a private Enterprise Cloud
        # repo will skip this step until the repo visibility is changed.
        if: github.event.repository.visibility == 'public' || github.event.repository.visibility == 'internal'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz,dist/*.zip
          sbom-path: dist/ledgerful-${{ steps.version.outputs.value }}.cdx.json
      - name: Attest MCP SBOM
        if: github.event.repository.visibility == 'public' || github.event.repository.visibility == 'internal'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tgz
          sbom-path: dist/ledgerful-mcp-server-${{ steps.version.outputs.value }}.cdx.json
      - name: Attest SBOM (private repo fallback)
        if: github.event.repository.visibility != 'public' && github.event.repository.visibility != 'internal'
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping GitHub SBOM attestation: repository is not public and this is not GitHub Enterprise Cloud."
          echo "Attestation will be enabled automatically once the repo is public (when the repository becomes public)."
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign archives + SBOM
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for artifact in dist/*.tar.gz dist/*.zip dist/*.tgz "dist/ledgerful-${version}.cdx.json" "dist/ledgerful-mcp-server-${version}.cdx.json"; do
            [ -f "$artifact" ] || continue
            cosign sign-blob \
              --yes \
              --output-signature="${artifact}.sig" \
              --output-certificate="${artifact}.pem" \
              --bundle="${artifact}.bundle" \
              "$artifact"
          done
      - name: Verify signatures (CI self-check)
        shell: bash
        env:
          GITHUB_WORKFLOW_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for artifact in dist/*.tar.gz dist/*.zip dist/*.tgz "dist/ledgerful-${version}.cdx.json" "dist/ledgerful-mcp-server-${version}.cdx.json"; do
            [ -f "$artifact" ] || continue
            cosign verify-blob \
              --bundle "${artifact}.bundle" \
              --certificate-identity "$GITHUB_WORKFLOW_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: |
            dist/*.sig
            dist/*.pem
            dist/*.bundle

  publish:
    name: Publish GitHub Release
    needs:
      - web-build
      - build
      - mcp-package
      - sbom
      - sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Verify GitHub attestations (public repo only)
        # gh attestation verify needs the artifact to have been attested by GitHub.
        # Repo is public; keep the private-repo fallback below in case visibility changes.
        if: github.event.repository.visibility == 'public' || github.event.repository.visibility == 'internal'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner="${{ github.repository_owner }}"
          # Binary provenance + SBOM attestation for each release archive + MCP package.
          # gh attestation verify checks all attestation types by default (provenance + SBOM).
          for bin in dist/*.tar.gz dist/*.zip dist/*.tgz; do
            [ -f "$bin" ] || continue
            gh attestation verify "$bin" --owner "$owner"
          done
      - name: Verify GitHub attestations (private repo fallback)
        if: github.event.repository.visibility != 'public' && github.event.repository.visibility != 'internal'
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping GitHub attestation verification: repository is not public and this is not GitHub Enterprise Cloud."
          echo "Verification will run automatically once the repo is public (when the repository becomes public)."
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Embedded SPA: ${{ needs.web-build.outputs.frontend_sha }}"
          } > notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tgz
            dist/*.sha256
            dist/*.cdx.json
            dist/*.sig
            dist/*.pem
            dist/*.bundle

  # 0101: publish @ledgerful/mcp-server via npm trusted publishing (OIDC).
  # MUST run after `publish` so GitHub Release assets exist before postinstall
  # can fetch releases/download/<tag>/…. Never put npm publish inside mcp-package
  # (that job finishes before any release asset is uploaded).
  # Nothing may declare needs: npm-publish — a registry outage must not fail a
  # release that already published GitHub artifacts.
  # Trusted publisher on npmjs.com must match: org Ryan-AI-Studios, this repo,
  # workflow filename release.yml, Allowed actions = npm publish, Environment empty.
  # Node 24 (not 22): trusted publishing needs npm >= 11.5.1; Node 22 LTS bundles
  # npm 10.x and fails with an auth error that looks like a broken trusted publisher.
  npm-publish:
    name: Publish MCP package to npm
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # cache intentionally off — publish job must not depend on npm cache state
      - name: Publish @ledgerful/mcp-server (or skip / fail per three-state policy)
        working-directory: mcp-server
        shell: bash
        run: |
          set -euo pipefail
          # Decision logic lives in scripts/npm-publish-decision.sh (unit-tested).
          # Exit 0=publish, 2=skip, 1=DoD-8 pin mismatch, 3=pin unreadable / bad input.
          # Real `npm publish` stays here — never inside the decision script.
          set +e
          decision="$(bash ../scripts/npm-publish-decision.sh package.json)"
          rc=$?
          set -e
          decision="$(printf '%s' "$decision" | tr -d '\r' | head -n1 | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"

          case "$rc" in
            0)
              if [ "$decision" != "publish" ]; then
                echo "error: unexpected decision '${decision}' for publish exit 0" >&2
                exit 1
              fi
              npm publish --access public
              version="$(node -p "require('./package.json').version")"
              local_pin="$(node -p "require('./package.json').ledgerfulEngineTag")"
              echo "published @ledgerful/mcp-server@${version} with ledgerfulEngineTag=${local_pin}"
              ;;
            2)
              if [ "$decision" != "skip" ]; then
                echo "error: unexpected decision '${decision}' for skip exit 2" >&2
                exit 1
              fi
              echo "decision=skip — re-dispatch safe, not publishing"
              exit 0
              ;;
            1|3)
              echo "decision=fail (rc=${rc}) — see errors above" >&2
              exit 1
              ;;
            *)
              echo "error: unexpected npm-publish-decision exit ${rc} decision='${decision}'" >&2
              exit 1
              ;;
          esac

  # 0051-PackageManagerDistribution: bump brew/scoop manifests from published .sha256
  # files. Always validates the bump script (dry-run + write to workspace). Pushing
  # to Ryan-AI-Studios/homebrew-tap and Ryan-AI-Studios/scoop-bucket requires
  # MANIFEST_PUSH_TOKEN (fine-grained PAT with contents:write on those repos).
  # Failure after publish is loud and recoverable by design (re-run push_one by hand
  # per docs/package-distribution.md) — do not change back to exit 0 on missing token.
  bump-manifests:
    name: Bump package manifests
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Download published checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p checksums
          # Prefer the just-published tag's .sha256 assets (authoritative).
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --pattern "*.sha256" \
            --dir checksums \
            --clobber
          ls -la checksums
      - name: Validate bump (always — DoD-4 fixture path in CI)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/bump-manifests.sh
          # Dry-run proves parse + fail-closed against live checksums
          scripts/bump-manifests.sh \
            --version "${{ steps.version.outputs.value }}" \
            --checksums-dir checksums \
            --packaging-dir packaging \
            --dry-run
          # Materialize outputs for optional push
          scripts/bump-manifests.sh \
            --version "${{ steps.version.outputs.value }}" \
            --checksums-dir checksums \
            --packaging-dir packaging \
            --out-dir bumped
          echo "---- homebrew/ledgerful.rb (head) ----"
          head -n 40 bumped/homebrew/ledgerful.rb
          echo "---- scoop/ledgerful.json ----"
          cat bumped/scoop/ledgerful.json
      # NOTE: secrets context is NOT allowed in `if:` expressions (causes
      # "Unrecognized named-value: 'secrets'" and 0-job workflow failures).
      # Gate push vs fail inside the shell with env presence (require-secret.sh).
      - name: Push to homebrew-tap + scoop-bucket
        shell: bash
        env:
          # Keep MANIFEST_PUSH_TOKEN for require-secret.sh.
          # GH_TOKEN at step level + `gh auth setup-git` so clone and later
          # `git push` authenticate without embedding the PAT in a URL (0082 RT-X9).
          MANIFEST_PUSH_TOKEN: ${{ secrets.MANIFEST_PUSH_TOKEN }}
          GH_TOKEN: ${{ secrets.MANIFEST_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/require-secret.sh
          # Hard-fail when misconfigured (0098). Loud after publish is intentional:
          # published release + unbumped manifests is recoverable; silent skip is not.
          scripts/require-secret.sh MANIFEST_PUSH_TOKEN
          # Configure git to use gh as credential helper for the whole step
          # (clone + later `git push`). GH_TOKEN alone authenticates `gh`
          # commands; setup-git is required for plain `git` (0082 RT-X9 / codex P2).
          # Do not embed the PAT in any clone URL (would land in .git/config).
          gh auth setup-git
          version="${{ steps.version.outputs.value }}"
          push_one() {
            local repo="$1"
            local src="$2"
            local dest_path="$3"
            local scratch
            scratch="$(mktemp -d)"
            gh repo clone "$repo" "$scratch" -- --depth 1
            mkdir -p "$(dirname "$scratch/$dest_path")"
            cp "$src" "$scratch/$dest_path"
            git -C "$scratch" config user.name "ledgerful-release[bot]"
            git -C "$scratch" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$scratch" add "$dest_path"
            if git -C "$scratch" diff --cached --quiet; then
              echo "${repo}: no changes for v${version}"
            else
              git -C "$scratch" commit -m "chore: bump ledgerful to v${version}"
              git -C "$scratch" push origin HEAD
              echo "${repo}: pushed v${version}"
            fi
          }
          # Tap dest is root-only ledgerful.rb (not Formula/ledgerful.rb).
          push_one "Ryan-AI-Studios/homebrew-tap" "bumped/homebrew/ledgerful.rb" "ledgerful.rb"
          push_one "Ryan-AI-Studios/scoop-bucket" "bumped/scoop/ledgerful.json" "ledgerful.json"
          {
            echo "### Manifest push"
            echo ""
            echo "Pushed v${version} to Ryan-AI-Studios/homebrew-tap and Ryan-AI-Studios/scoop-bucket."
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-publish asset smoke (0098). needs: publish only so a failed bump-manifests
  # (missing token) does not delete version verification.
  verify-assets:
    name: Verify published assets
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Assert assets + Linux --version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p release-assets
          gh release download "$tag" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --clobber

          expected=(
            "ledgerful-x86_64-unknown-linux-gnu.tar.gz"
            "ledgerful-x86_64-unknown-linux-gnu.tar.gz.sha256"
            "ledgerful-x86_64-pc-windows-msvc.zip"
            "ledgerful-x86_64-pc-windows-msvc.zip.sha256"
            "ledgerful-x86_64-apple-darwin.tar.gz"
            "ledgerful-x86_64-apple-darwin.tar.gz.sha256"
            "ledgerful-aarch64-apple-darwin.tar.gz"
            "ledgerful-aarch64-apple-darwin.tar.gz.sha256"
            "ledgerful-${version}.cdx.json"
            "ledgerful-mcp-server-${version}.cdx.json"
          )
          # MCP tgz name is npm pack style; accept any .tgz
          shopt -s nullglob
          tgz=(release-assets/*.tgz)
          if [ "${#tgz[@]}" -lt 1 ]; then
            echo "error: expected at least one .tgz MCP package asset" >&2
            ls -la release-assets >&2 || true
            exit 1
          fi

          missing=0
          for f in "${expected[@]}"; do
            if [ ! -f "release-assets/${f}" ]; then
              echo "error: missing expected asset: ${f}" >&2
              missing=1
            fi
          done
          # Signature set: cosign keyless publishes **.bundle** on the GitHub Release
          # (observed v0.2.1 and v0.2.3). The sign job still writes .sig/.pem into the
          # job artifact, but softprops/action-gh-release has only ever attached
          # .bundle assets — requiring .sig/.pem here is a false fail. Require bundles.
          bundles=(release-assets/*.bundle)
          if [ "${#bundles[@]}" -lt 1 ]; then
            echo "error: expected cosign .bundle signature artifacts on the release" >&2
            missing=1
          fi
          # Optional notice if detached .sig/.pem ever appear (forward-compatible)
          sigs=(release-assets/*.sig)
          pems=(release-assets/*.pem)
          if [ "${#sigs[@]}" -lt 1 ] || [ "${#pems[@]}" -lt 1 ]; then
            echo "::notice::release has .bundle only (no detached .sig/.pem assets) — matches cosign keyless publish history"
          fi
          if [ "$missing" -ne 0 ]; then
            ls -la release-assets >&2 || true
            exit 1
          fi

          tar -xzf release-assets/ledgerful-x86_64-unknown-linux-gnu.tar.gz -C release-assets
          bin="release-assets/ledgerful-x86_64-unknown-linux-gnu/ledgerful"
          chmod +x "$bin"
          got="$("$bin" --version)"
          echo "binary --version: ${got}"
          # Accept "ledgerful 0.2.3" or bare version
          if ! printf '%s\n' "$got" | grep -Eq "(^| )${version}( |$)"; then
            echo "error: --version '${got}' does not report expected version ${version}" >&2
            exit 1
          fi
          {
            echo "### verify-assets"
            echo ""
            echo "Linux archive --version: \`${got}\` (expected ${version})"
          } >> "$GITHUB_STEP_SUMMARY"

  # Live tap/bucket version check (0098). needs: bump-manifests. Reads live via
  # gh api — never from this job's own bumped/ output.
  verify-manifests:
    name: Verify live package manifests
    needs: bump-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Read homebrew-tap + scoop-bucket live
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Live file contents (base64) from default branch
          brew_b64="$(gh api repos/Ryan-AI-Studios/homebrew-tap/contents/ledgerful.rb --jq .content)"
          scoop_b64="$(gh api repos/Ryan-AI-Studios/scoop-bucket/contents/ledgerful.json --jq .content)"
          brew_rb="$(printf '%s' "$brew_b64" | tr -d '\n' | base64 -d)"
          scoop_json="$(printf '%s' "$scoop_b64" | tr -d '\n' | base64 -d)"

          echo "---- live ledgerful.rb (version lines) ----"
          printf '%s\n' "$brew_rb" | grep -E 'version |url ' | head -n 20 || true
          echo "---- live ledgerful.json ----"
          printf '%s\n' "$scoop_json"

          if ! printf '%s\n' "$brew_rb" | grep -Eq "version \"${version}\""; then
            echo "error: homebrew-tap ledgerful.rb does not report version \"${version}\"" >&2
            exit 1
          fi
          if ! printf '%s\n' "$scoop_json" | grep -Eq "\"version\"[[:space:]]*:[[:space:]]*\"${version}\""; then
            echo "error: scoop-bucket ledgerful.json does not report version \"${version}\"" >&2
            exit 1
          fi
          # C3 (0164): live formula install body lockstep — buildpath Pathname.glob,
          # not the old CWD-relative Dir["ledgerful-…] locator.
          if ! printf '%s\n' "$brew_rb" | grep -Fq 'Pathname.glob(buildpath'; then
            echo "error: homebrew-tap ledgerful.rb install must use Pathname.glob(buildpath…)" >&2
            exit 1
          fi
          if printf '%s\n' "$brew_rb" | grep -Fq 'Dir["ledgerful-'; then
            echo "error: homebrew-tap ledgerful.rb install must not use Dir[\"ledgerful-…] locator" >&2
            exit 1
          fi
          {
            echo "### verify-manifests"
            echo ""
            echo "Live homebrew-tap and scoop-bucket report version ${version}."
            echo "Homebrew install body: Pathname.glob(buildpath…) present; Dir[\"ledgerful-…] absent."
          } >> "$GITHUB_STEP_SUMMARY"

  # 0051 winget: subsequent version bumps via SHA-pinned winget-releaser.
  # First-time package submission must exist in microsoft/winget-pkgs first
  # (manual wingetcreate / PR); this action requires ≥1 version already present.
  # NOTE: do not use `if: secrets.*` at job level — that has caused 0-job workflow
  # failures on tag pushes. Gate inside the step with an env-presence check instead.
  winget-release:
    name: Submit winget package update
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Detect WINGET_TOKEN
        id: winget_token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "${WINGET_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::winget-release skipped — WINGET_TOKEN intentionally unset (see planner-handoff §5.1 / package-distribution.md)"
            {
              echo "### winget-release"
              echo ""
              echo "Skipped — \`WINGET_TOKEN\` intentionally unset (first-package PR / etiquette; see docs/package-distribution.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: WinGet Releaser
        if: steps.winget_token.outputs.present == 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: Ledgerful.Ledgerful
          # Portable Windows zip from release.yml (not msi/exe installer)
          installers-regex: 'ledgerful-x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
