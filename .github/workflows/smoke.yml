name: Install Smoke Test

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_NET_RETRY: 10
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --path . --features mcp,web --locked --force
      - run: ledgerful --version
      - name: Run MCP Smoke Test (Bash)
        if: runner.os != 'Windows'
        run: ./scripts/smoke_mcp.sh
      - name: Run MCP Smoke Test (PowerShell)
        if: runner.os == 'Windows'
        run: ./scripts/smoke_mcp.ps1
