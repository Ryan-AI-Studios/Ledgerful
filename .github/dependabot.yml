version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Delay version-update PRs after a crate is published so yank/compromise
    # windows are less likely to auto-PR same-day (supply-chain hygiene).
    # Security updates are not delayed by cooldown.
    cooldown:
      # Semgrep package_managers.dependabot-missing-cooldown requires default-days: 7
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Exact pins must not be rewritten (Dependabot #143 rewrote rayon =1.10 → =1.11
    # and broke graph_builder/cozo). Keep all three intentional `=` pins.
    ignore:
      - dependency-name: "rayon"
        # Exact pin =1.10: graph_builder (cozo) fails on rayon 1.11+
      - dependency-name: "fs4"
        # Exact pin =0.13.1 — do not rewrite
      - dependency-name: "url"
        # Exact pin =2.5.8 — do not rewrite
      - dependency-name: "scip"
        update-types: ["version-update:semver-major"]
        # Classic-range consumer only; typed_range adapter = future track

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
