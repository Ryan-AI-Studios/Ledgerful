[package]
name = "ledgerful-ledger"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false
description = "Ledgerful ledger core: types, chain, signatures, SQLite rows"
readme = "README.md"
homepage.workspace = true
repository.workspace = true

[dependencies]
camino = { version = "1.2.5", features = ["serde1"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4"
miette = { version = "7.6.0", features = ["fancy"] }
path-clean = "1.0.1"
rand = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1.26", features = ["v4", "serde"] }

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3"
